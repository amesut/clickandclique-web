<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click &amp; Clique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main id="main" class="page-main">
    <section class="hero" aria-label="Open Click and Clique">
      <div class="hero__inner">
        <p class="brand-mark">Click <span>&amp; Clique</span></p>
        <p class="tagline" id="status">Opening the event…</p>
        <div class="hero-actions">
          <a class="btn btn--primary" id="openApp" href="index.html">Open in app</a>
          <a class="btn btn--ghost" id="openStore" href="index.html">Get the app</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var ANDROID_PACKAGE = "com.example.clickandclique";
      var PLAY_STORE =
        "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
      // App Store sayısal ID yayınlanınca buraya yaz (ör. 1234567890).
      var APPLE_APP_ID = "";
      var APP_STORE = APPLE_APP_ID
        ? "https://apps.apple.com/app/id" + APPLE_APP_ID
        : "https://apps.apple.com/search?term=" +
          encodeURIComponent("Click and Clique");

      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      var params = new URLSearchParams(window.location.search);
      var eventId = (params.get("id") || "").trim();
      if (!eventId) {
        var parts = window.location.pathname.split("/").filter(Boolean);
        if (parts[0] === "e" && parts[1]) eventId = parts[1];
      }

      var storeUrl = isIOS ? APP_STORE : PLAY_STORE;
      var status = document.getElementById("status");
      var openApp = document.getElementById("openApp");
      var openStore = document.getElementById("openStore");
      if (openStore) openStore.setAttribute("href", storeUrl);

      if (!eventId) {
        if (status) status.textContent = "Get Click & Clique.";
        if (openApp) openApp.setAttribute("href", storeUrl);
        if (isAndroid || isIOS) window.location.replace(storeUrl);
        return;
      }

      params.set("id", eventId);
      var qs = params.toString();
      var appUrl = "clickandclique://e/" + encodeURIComponent(eventId);
      if (qs) appUrl += "?" + qs;
      if (openApp) openApp.setAttribute("href", appUrl);

      // App yüklüyse etkinlik detayı açılır. Değilse mağaza.
      if (isAndroid) {
        var intent =
          "intent://e/" +
          encodeURIComponent(eventId) +
          (qs ? "?" + qs : "") +
          "#Intent;scheme=clickandclique;package=" +
          ANDROID_PACKAGE +
          ";S.browser_fallback_url=" +
          encodeURIComponent(PLAY_STORE) +
          ";end";
        window.location.replace(intent);
        return;
      }

      if (isIOS) {
        var left = false;
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) left = true;
        });
        window.location.replace(appUrl);
        setTimeout(function () {
          if (left || document.hidden) return;
          window.location.replace(APP_STORE);
        }, 1400);
        return;
      }

      if (status) {
        status.textContent = "Open this event in the Click & Clique app.";
      }
    })();
  </script>
</body>
</html>
